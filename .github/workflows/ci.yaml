name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          package-manager-cache: false
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - name: Build
        run: yarn build
